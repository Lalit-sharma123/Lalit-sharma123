<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" role="img" aria-label="Database AI Agent: Ask a database questions in plain English and let the agent work out the SQL. Stack: LLMs, SQL, FastAPI"><title>Database AI Agent: Ask a database questions in plain English and let the agent work out the SQL. Stack: LLMs, SQL, FastAPI</title><style>
.f{animation:fi .9s cubic-bezier(.2,.7,.2,1) both}
