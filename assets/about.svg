<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" width="100%" role="img" aria-label="About Lalit Kumar Sharma. I build AI-powered software meant to be used: LLM applications, retrieval-augmented generation (RAG) systems, AI agents, and automation that connects to real databases and APIs. My work sits where models meet engineering: designing agent workflows, wiring LLMs to SQL and vector stores, serving everything through FastAPI, and packaging it with Docker. role: AI Developer / AI Engineer; builds: LLM apps, RAG systems, AI agents, automation; stack: Python, FastAPI, LangChain, LangGraph; data: SQL databases + vector search; ships: Docker, REST APIs; interest: self-hosted and open-source AI models"><title>About Lalit Kumar Sharma. I build AI-powered software meant to be used: LLM applications, retrieval-augmented generation (RAG) systems, AI agents, and automation that connects to real databases and APIs. My work sits where models meet engineering: designing agent workflows, wiring LLMs to SQL and vector stores, serving everything through FastAPI, and packaging it with Docker. role: AI Developer / AI Engineer; builds: LLM apps, RAG systems, AI agents, automation; stack: Python, FastAPI, LangChain, LangGraph; data: SQL databases + vector search; ships: Docker, REST APIs; interest: self-hosted and open-source AI models</title><style>
.f{animation:fi .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fi{from{transform:translateY(14px)}to{transform:translateY(0)}}
.blink{animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.f,.blink,.pulse{animation:none}}
</style><defs>
