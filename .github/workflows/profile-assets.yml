name: Build profile assets

# Rebuilds assets/stats.svg (glass stats card) and the dark contribution snake.
# Optional: add a repository secret STATS_TOKEN (a classic personal access token with
# "read:user") so the stats include private contributions. Without it, public only.

on:
  schedule:
    - cron: "0 0 * * *"      # daily
  workflow_dispatch:          # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency: profile-assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python tools/build_stats.py "${{ github.repository_owner }}"

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || { git commit -m "Update stats card" && git push; }

      - name: Build snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark

      - name: Restyle the snake to the profile theme
        run: python tools/frame_snake.py dist/*.svg

      - name: Push snake to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
